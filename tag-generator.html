  }
  :root { --bg: #f4f4f6; --card: #fff; --text: #1d1d22; --muted: #6b6b76; --line: #d8d8e0; --accent: #5865f2; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #16161a; --card: #22222a; --text: #f0f0f4; --muted: #9a9aa6; --line: #34343e; --accent: #7983f5; }
  }
  :root[data-theme="dark"] { --bg: #16161a; --card: #22222a; --text: #f0f0f4; --muted: #9a9aa6; --line: #34343e; --accent: #7983f5; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  input[type="text"], select { width: 100%; box-sizing: border-box; padding: 9px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; }
  .row { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; margin-top: 12px; }
  .row > div { flex: 1; min-width: 120px; }
  .swatches { display: flex; flex-wrap: wrap; gap: 8px; }
  .swatch { width: 32px; height: 32px; border-radius: 6px; border: 2px solid transparent; cursor: pointer; padding: 0; }
  .swatch[aria-pressed="true"] { border-color: var(--text); }
  input[type="color"] { width: 42px; height: 34px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: none; cursor: pointer; }
  .preview { display: flex; justify-content: center; align-items: center; min-height: 120px; background: repeating-conic-gradient(#8884 0% 25%, transparent 0% 50%) 50% / 16px 16px; border-radius: 8px; }
  canvas { image-rendering: pixelated; }
  .buttons { display: flex; gap: 10px; flex-wrap: wrap; }
  button.action { flex: 1; min-width: 140px; padding: 10px 14px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button.action.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  #status { font-size: 13px; color: var(--muted); min-height: 1.2em; margin-top: 8px; }
  input[type="range"] { width: 100%; margin: 6px 0 0; accent-color: var(--accent); }
  @media (max-width: 420px) { main { padding: 16px 12px; } }
</style>
</head>
<body>
<main>
  <h1>Rank Tag Generator</h1>

  <div class="card">
    <label for="text">Tag text</label>
    <input id="text" type="text" maxlength="24" value="CREATOR" autocomplete="off">

    <div class="row">
      <div>
        <label for="font">Font</label>
        <select id="font">
          <option value="five" selected>Minecraft Five Bold</option>
          <option value="caps">Minecraft Five Bold, small caps</option>
          <option value="press">Press Start 2P</option>
        </select>
      </div>
      <div>
        <label for="spacing">Letter spacing: <span id="spacingVal">7px</span></label>
        <input id="spacing" type="range" min="4" max="14" value="7">
      </div>
    </div>

    <div class="row">
      <div>
        <label>Color</label>
        <div class="swatches" id="swatches"></div>
      </div>
      <div style="flex: 0 0 auto; min-width: 0;">
        <label for="custom">Custom</label>
        <input id="custom" type="color" value="#ff0000">
      </div>
    </div>

    <div class="row">
      <div style="flex: 0 0 auto; min-width: 120px;">
        <label for="scale">Export size</label>
        <select id="scale">
          <option value="1">1x (native)</option>
          <option value="2">2x</option>
          <option value="3" selected>3x</option>
          <option value="4">4x</option>
          <option value="6">6x</option>
        </select>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="preview"><canvas id="preview"></canvas></div>
  </div>

  <div class="card">
    <div class="buttons">
      <button class="action" id="download">Download PNG</button>
      <button class="action secondary" id="copy">Copy image</button>
    </div>
    <div id="status" role="status"></div>
  </div>
</main>

<script>
  // Fill colors sampled from the server's tags.
  const PRESETS = {
    Red: '#ff0000', Gold: '#d8aa1b', Lime: '#8ab830', Emerald: '#37b028', Rose: '#b42a51'
  };
  const H = 11;                 // tag height in native pixels
  // small: size of typed lowercase letters, which render as small caps
  const FONTS = {
    five: { css: '"Minecraft Five"', size: 8 },
    caps: { css: '"Minecraft Five"', size: 8, small: 6 },
    press: { css: '"Press Start 2P"', size: 8 }
  };

  const state = { text: 'CREATOR', color: PRESETS.Red, font: 'five', spacing: 7 };

  // Mix a color toward white (amt > 0) or black (amt < 0).
  function shade(hex, amt) {
    const v = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));
    return '#' + v.map(x => Math.round(amt < 0 ? x * (1 + amt) : x + (255 - x) * amt))
                  .map(x => x.toString(16).padStart(2, '0')).join('');
  }

  // Draws the tag at native size, then scales it up with nearest-neighbour.
  function drawTag(canvas, text, color, scale) {
    const ctx = canvas.getContext('2d');
    const f = FONTS[state.font];
    const w = state.spacing * [...text].length + 7;
    canvas.width = w * scale;
    canvas.height = H * scale;
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.imageSmoothingEnabled = false;
    ctx.clearRect(0, 0, w, H);

    ctx.fillStyle = shade(color, -0.5);           // dark outline
    ctx.fillRect(0, 0, w, H);
    ctx.clearRect(0, 0, 1, 1); ctx.clearRect(w - 1, 0, 1, 1);
    ctx.clearRect(0, H - 1, 1, 1); ctx.clearRect(w - 1, H - 1, 1, 1);

    ctx.fillStyle = shade(color, 0.35);           // top highlight
    ctx.fillRect(1, 1, w - 2, 1);
    ctx.fillStyle = color;                        // body
    ctx.fillRect(1, 2, w - 2, H - 4);
    ctx.fillStyle = shade(color, -0.25);          // bottom shade
    ctx.fillRect(1, H - 2, w - 2, 1);

    // Letters: white at the top, grey through the middle, fill-dark at the base.
    const grad = ctx.createLinearGradient(0, 3, 0, 9);
    grad.addColorStop(0, '#f5f5f5');
    grad.addColorStop(0.5, '#e1e1e1');
    grad.addColorStop(0.8, '#d1d1d1');
    grad.addColorStop(1, shade(color, -0.3));
    ctx.textBaseline = 'middle';
    ctx.fillStyle = grad;
    [...text].forEach((ch, i) => {
      const up = ch.toUpperCase();
      const small = f.small && ch !== up;   // typed lowercase letters become small caps
      ctx.font = `${small ? f.small : f.size}px ${f.css}`;
      ctx.fillText(up, 4 + i * state.spacing, H / 2);
    });
  }

  const preview = document.getElementById('preview');
  const $ = id => document.getElementById(id);

  function update() {
    drawTag(preview, state.text || ' ', state.color, 4);
    preview.style.width = preview.width + 'px';
    preview.style.height = preview.height + 'px';
  }

  function exportCanvas() {
    const c = document.createElement('canvas');
    drawTag(c, state.text || ' ', state.color, Number($('scale').value));
    return c;
  }

  function setStatus(msg) { $('status').textContent = msg; }

  // Swatch buttons
  for (const [name, hex] of Object.entries(PRESETS)) {
    const b = document.createElement('button');
    b.className = 'swatch';
    b.title = name;
    b.style.background = hex;
    b.setAttribute('aria-label', name);
    b.setAttribute('aria-pressed', hex === state.color);
    b.onclick = () => {
      state.color = hex;
      $('custom').value = hex;
      document.querySelectorAll('.swatch').forEach(s => s.setAttribute('aria-pressed', s === b));
      update();
    };
    $('swatches').appendChild(b);
  }

  $('text').addEventListener('input', e => { state.text = e.target.value; update(); });
  $('font').addEventListener('change', e => { state.font = e.target.value; update(); });
  $('spacing').addEventListener('input', e => {
    state.spacing = Number(e.target.value);
    $('spacingVal').textContent = state.spacing + 'px';
    update();
  });
  $('custom').addEventListener('input', e => {
    state.color = e.target.value;
    document.querySelectorAll('.swatch').forEach(s => s.setAttribute('aria-pressed', 'false'));
    update();
  });

  $('download').onclick = () => {
    const link = document.createElement('a');
    link.download = (state.text || 'tag').toLowerCase().replace(/[^a-z0-9]+/g, '-') + '.png';
    link.href = exportCanvas().toDataURL('image/png');
    link.click();
    setStatus('Downloaded ' + link.download);
  };

  $('copy').onclick = () => {
    exportCanvas().toBlob(async blob => {
      try {
        await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
        setStatus('Copied to clipboard');
      } catch (err) {
        setStatus('Copy is not allowed here, use Download instead');
      }
    }, 'image/png');
  };

  // Wait for the pixel font so the first draw uses it.
  (document.fonts ? Promise.all(Object.values(FONTS).map(f => document.fonts.load(`${f.size}px ${f.css}`))) : Promise.resolve())
    .catch(() => {}).then(update);
</script>
</body>
</html>
